kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kruise-game-dashboard-role
rules:
  - apiGroups:
      - 'extensions.kubesphere.io'
    verbs:
      - '*'
    resources:
      - '*'
  - apiGroups:
      - 'game.kruise.io'
    verbs:
      - '*'
    resources:
      - 'gameservers'
      - 'gameserversets'
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - '*'
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - '*'
